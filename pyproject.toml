[project]
name = "mantis"
version = "1.2.1"
description = "An interactive web application to track Mantis religiosa sightings in Germany."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "blinker>=1.9.0",
    "click>=8.5.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-favicon>=0.1.4",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "geopy>=2.5.0",
    "gunicorn>=26.2.0",
    "heroicons[jinja]>=2.14.0",
    "jinja2>=3.1.6",
    "mako>=1.4.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "psycopg[binary]>=3.3.6",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.54",
    "svgwrite>=1.4.3",
    "werkzeug>=3.1.8",
    "wtforms>=3.2.2",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "sqlalchemy-utils>=0.42.1",
    "ty>=0.0.82",
]

docs = [
    "alabaster>=1.0.0",
    "docutils>=0.22.4",
    "imagesize>=2.0.1",
    "pygments>=2.21.0",
    "snowballstemmer>=3.1.1",
    "sphinx>=9.1.0",
    "sphinx_rtd_theme>=3.1.0",
    "sphinxcontrib-applehelp>=2.0.0",
    "sphinxcontrib-devhelp>=2.0.0",
    "sphinxcontrib-htmlhelp>=2.1.0",
    "sphinxcontrib-jsmath>=1.0.1",
    "sphinxcontrib-qthelp>=2.0.0",
    "sphinxcontrib-serializinghtml>=2.0.0",
]

[tool.uv]
# Flat layout, no entry points, never published. uv infers this today from the
# absent build-system; saying it keeps a later one from installing the app into
# its own environment.
package = false

[tool.pytest.ini_options]
# app/tools holds no tests; it is collected for the doctests in three modules.
testpaths = ["tests", "app/tools"]
pythonpath = ["."]
# No -x: a fault in the shared database fixture errors every test that follows
# it, and the first of those errors says nothing about the cause.
addopts = "-l --doctest-modules"
filterwarnings = [
    "error::DeprecationWarning",
    # flask-login 0.6.3 (last release, 2023-10-30) calls datetime.utcnow(), which
    # 3.12 deprecated. Fixed upstream, unreleased. Drop this on the next release.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login.login_manager",
]

[tool.ruff.lint]
# Pinned: ruff widens its implicit default between releases, so an upgrade would
# add lint errors on its own.
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "B",   # bugbear
    "C4",  # comprehensions
    "ISC", # implicit str concat
    "LOG", # logging misuse
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "UP",  # pyupgrade
]
# Candidates, each with violations today: G, DTZ, RUF, PTH, ARG, S. Read the
# current count with `ruff check --select <rule> --statistics .` — most of S is
# `assert` in tests.

[tool.ruff.lint.flake8-pytest-style]
# Ruff defaults to the tuple form; pytest's own documentation writes "a,b".
parametrize-names-type = "csv"
