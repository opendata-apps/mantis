# Shared base for both stacks; differences go in an override file, since an
# override cannot drop a value without !reset. The dev project name is the
# default, so production has to be asked for (compose.prod.yaml plus -p).
name: mantis_dev

services:
  db:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - mantis_data:/var/lib/postgresql/data
    networks:
      - mantis_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ..
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - FLASK_DEBUG=0
      - DATABASE_HOST=db
      - UPLOAD_FOLDER=/mantis/app/datastore
      - BACKUP_DIR=/mantis/backups
    volumes:
      - ../app/datastore:/mantis/app/datastore:z
      - ../backups:/mantis/backups:z
    networks:
      - mantis_backend
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold start runs every migration and a full seed before gunicorn binds.
      start_period: 60s

volumes:
  mantis_data:

networks:
  # Don't pin an ipam subnet here: podman-compose 1.5.0 with netavark ignores it
  # anyway, and a fixed subnet is what stops a second stack coming up alongside.
  mantis_backend:
    driver: bridge
