# Development overlay. Loaded automatically by a bare `podman-compose up` run
# from this directory, which is why development is the default and production
# needs compose.prod.yaml spelled out.

services:
  web:
    # Replaces the image's gunicorn CMD. Serves the Werkzeug debugger, so this
    # stack binds loopback only.
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]
    # Read by entrypoint.sh, which seeds demo reports when it is 1.
    environment:
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
    # Source mounted over the image so Flask reloads without a rebuild.
    volumes:
      - ..:/mantis:z
    # Overridable: rootless podman isolates everything except the host's ports.
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"

  vite:
    image: docker.io/oven/bun:1
    working_dir: /mantis
    command: ["sh", "-c", "bun install --network-concurrency 4 && bunx vite build --watch"]
    volumes:
      - ..:/mantis:z
    networks:
      - mantis_backend
    depends_on:
      - web

  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5431}:5432"
