# Development overlay. Loaded automatically by a bare `podman-compose up` run
# from this directory, which is why development is the default and production
# needs compose.prod.yaml spelled out.

services:
  web:
    environment:
      - FLASK_DEBUG=1
    # Source mounted over the image so Flask reloads without a rebuild.
    volumes:
      - ..:/mantis:z
    # Overridable so a second dev stack can run beside another one on the same
    # host — a staging instance under its own user shares nothing with rootless
    # podman except the host's ports.
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"

  vite:
    image: docker.io/oven/bun:1
    working_dir: /mantis
    command: ["sh", "-c", "bun install --network-concurrency 4 && bunx vite build --watch"]
    volumes:
      - ..:/mantis:z
    networks:
      - mantis_backend
    depends_on:
      - web

  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5431}:5432"
