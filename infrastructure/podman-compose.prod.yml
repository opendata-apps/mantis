services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - mantis_data:/var/lib/postgresql/data
    networks:
      - mantis_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - FLASK_DEBUG=0
      - DATABASE_HOST=db
      - UPLOAD_FOLDER=/mantis/app/datastore
      - BACKUP_DIR=/mantis/backups
      # Deployment metadata, not image content: baked in as a build ARG it was
      # served from the layer cache whenever a deploy touched no copied file,
      # so /health reported the previous commit. Read at request time.
      - GIT_SHA=${GIT_SHA:-unknown}
    volumes:
      - ../app/datastore:/mantis/app/datastore:z
      - ../backups:/mantis/backups:z
    networks:
      - mantis_backend
    # Bound to loopback: nginx proxies to 127.0.0.1:5000, so nothing needs the
    # public interface. Without the host IP this listens on *:5000 and only
    # firewalld stands between the internet and a Flask app that would bypass
    # nginx's rate limiting, harvester 403 and scanner filter.
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    # start_period is sized for a cold start against an empty volume, where the
    # entrypoint runs every migration and a full seed before gunicorn binds. It
    # only delays when failures start counting; the deploy itself is gated by
    # the curl retry loop in `just prod-deploy`.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  mantis_data:

networks:
  # Don't pin an ipam subnet here: podman-compose 1.5.0 with netavark ignores it
  # anyway, and a fixed subnet is what stops a second stack coming up alongside.
  mantis_backend:
    driver: bridge
