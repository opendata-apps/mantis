services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - mantis_data:/var/lib/postgresql/data
    networks:
      - mantis_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - FLASK_DEBUG=0
      - DATABASE_HOST=db
      - UPLOAD_FOLDER=/mantis/app/datastore
      - BACKUP_DIR=/mantis/backups
    volumes:
      - ../app/datastore:/mantis/app/datastore:z
      - ../backups:/mantis/backups:z
    networks:
      - mantis_backend
    # Bound to loopback: nginx proxies to 127.0.0.1:5000, so nothing needs the
    # public interface. Without the host IP this listens on *:5000 and only
    # firewalld stands between the internet and a Flask app that would bypass
    # nginx's rate limiting, harvester 403 and scanner filter.
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    # CMD-SHELL, not CMD: Docker word-splits the final element of a CMD array,
    # so `python -c "<code>"` reaches python as `-c import` and dies with a
    # SyntaxError. Podman keeps it intact, which is why this only shows up if
    # the compose provider changes. CMD-SHELL passes one string to sh and is
    # what the db service above already uses.
    # start_period covers a cold start: against an empty volume the entrypoint
    # runs every migration and a full seed before gunicorn binds. 40s only ever
    # sufficed because the production volume is already populated.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  mantis_data:

networks:
  mantis_backend:
    driver: bridge
