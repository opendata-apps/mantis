# Production overlay, see the justfile's `compose`.
# Never change this name: the live mantis_data volume hangs off it, and a new
# name resolves to a fresh, empty database. podman-compose 1.5 reads the name
# from the first file only, so -p is required too; keep both in step.
name: infrastructure

services:
  db:
    restart: unless-stopped

  web:
    restart: unless-stopped
    # Four ~130 MiB workers leave room for a few 50 MP HEIC decodes (~600 MiB
    # each). Past this the kernel kills a worker inside this container, which
    # gunicorn respawns, instead of picking Postgres on a host without swap.
    mem_limit: 3g
    # Both outside the checkout: the base's repo paths are gitignored, so
    # `git clean -fdx` would delete every photo and backup. Photos are app-only,
    # hence a volume; backups are also written from the host by prod-backup,
    # hence a bind mount.
    volumes:
      - mantis_datastore:/mantis/app/datastore
      - /home/mantis/data/backups:/mantis/backups:z
    environment:
      # Not a Dockerfile build ARG: buildah caches the ENV layer by instruction
      # text, so an unchanged build would report the previous commit on /health.
      - GIT_SHA=${GIT_SHA:-unknown}
    # Loopback only: nginx proxies here, and a public port would bypass nginx's
    # rate limiting and filters.
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"

volumes:
  mantis_datastore:
