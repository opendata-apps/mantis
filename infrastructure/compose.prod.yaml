# Production overlay. Used explicitly:
#   podman-compose -f compose.yaml -f compose.prod.yaml up -d
#
# This name is what the live containers and the mantis_data volume hang off.
# Changing it resolves to a fresh, empty volume — an empty database.
name: infrastructure

services:
  db:
    restart: unless-stopped

  web:
    restart: unless-stopped
    environment:
      # Deployment metadata, not image content — don't move this into the
      # Dockerfile as a build ARG. buildah keys the ENV layer on the instruction
      # text rather than the arg value, so a deploy touching no copied file
      # serves the whole image from cache and /health answers the wrong commit.
      - GIT_SHA=${GIT_SHA:-unknown}
    # Loopback only: nginx proxies to 127.0.0.1:5000, so nothing needs the public
    # interface. Published on all interfaces, only firewalld stands between the
    # internet and a Flask app that bypasses nginx's rate limiting, harvester 403
    # and scanner filter.
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
