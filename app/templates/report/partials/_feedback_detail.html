{# HTMX partial: Feedback detail field #}
{% from 'report/_macros_form.html' import report_field_class %}
{% if show %}
  <div id="feedback_detail_container" class="form-group">
    <label for="feedback_detail"
           class="block text-sm font-medium text-gray-700 mb-1">Details (optional)</label>
    <input type="text"
           id="feedback_detail"
           name="feedback_detail"
           placeholder="{{ placeholder }}"
           autocomplete="off"
           maxlength="255"
           class="{{ report_field_class() }}">
  </div>
{% else %}
  <div id="feedback_detail_container" class="hidden">
    <input type="hidden" name="feedback_detail" value="">
  </div>
{% endif %}
