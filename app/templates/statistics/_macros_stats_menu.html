{% macro StatsMenu() -%}
<div class="p-3 bg-white rounded-lg border border-gray-200 sm:p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="relative w-full max-w-xs">
    <select id="stats" name="stats" data-autosubmit
      class="appearance-none bg-none py-2.5 pr-9 pl-3.5 w-full text-sm text-gray-700 bg-white rounded-lg border border-gray-300 transition-[color,background-color,border-color,box-shadow] duration-200 focus:outline-hidden focus-visible:border-green-500 focus-visible:ring-2 focus-visible:ring-green-500/30">
      {% for statistik in menu.items() %}
      <option value="{{ statistik[0] }}" {% if statistik[0]==marker %}selected="selected" {% endif %}>{{ statistik[1] }}
      </option>
      {% endfor %}
    </select>
    {{ heroicon_outline("chevron-down", class="absolute right-3 top-1/2 size-4 text-gray-500 pointer-events-none
    -translate-y-1/2", stroke_width=2) }}
  </div>
</div>
{%- endmacro %}
